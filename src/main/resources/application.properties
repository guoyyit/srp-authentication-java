# HTTP server
server.port=8080

# SRP-6a settings
# directory for durable state (registrations, locks, sessions, replay cache, audit)
srp.data-dir=data
# JCA digest used for new registrations (each registration records its own digest)
srp.digest-algorithm=SHA-256
# PBKDF2 iteration count for password stretching (>= 1; higher resists offline dictionary attacks)
srp.iterations=20000
# lifetime of an in-progress handshake in seconds
srp.handshake-ttl-seconds=120
# lifetime of an issued session token in seconds
srp.session-ttl-seconds=3600
# consecutive failures before locking (per identity and per identity+source)
srp.max-failures=5
# lock duration in seconds
srp.lock-seconds=900
