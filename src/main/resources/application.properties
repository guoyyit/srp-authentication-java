server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false

srp.data-dir=data
srp.digest=SHA-256
srp.derivation=PBKDF2
srp.iterations=100000
srp.salt-bytes=16
srp.max-failures=5
srp.lock-seconds=900
srp.handshake-ttl-seconds=120
srp.session-ttl-seconds=3600
srp.replay-retention-seconds=86400
